pipeline {
    agent {
        label 'mac-runner'
    }

    stages {
        stage('Clone') {
            steps {
                git branch: 'main',
                    url: 'https://github.com/nagenderb/testing.git'

            }
        }
        stage('Pre-Requisite') {
            steps {

                sh '''
                    rm -rf smokereg/results
                    mkdir -p smokereg/results
                    cd smokereg
                    python3  utils/initializeapp.py
                    
                '''
            }
        }
        stage('Run Tests') {
            steps {
                sh '''
                    cd smokereg
                    echo "=== RUN ROBOT TESTS ==="
                    python3 -m robot \
                        -d results \
                        --variable APP_VERSION:"${APP_VERSION}" \
                        tests
                   
                '''          
            }
        }
        stage('Export Results') {
            steps {
                sh '''
                    cd smokereg
                    python3  utils/exportresults.py
                    
                '''           
            }
        }

    }

    post {
        always {
            robot(
                outputPath: 'smokereg/results',
                outputFileName: 'output.xml',
                reportFileName: 'report.html',
                logFileName: 'log.html'
            )

            archiveArtifacts(
                artifacts: 'smokereg/results/**/*,demoapp.log',
                allowEmptyArchive: true
            )
        }
    }
}

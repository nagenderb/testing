pipeline {
    agent {
        label 'mac-runner'
    }

    stages {
        stage('Run Automation') {
            steps {
                git branch: 'main',
                    url: 'https://github.com/nagenderb/testing.git'

                sh '''
                    echo "=== DEBUG ==="
                    ls -a
                    pwd

                    echo "=== RUN ROBOT TESTS ==="
                    rm -rf stagetest/results
                    mkdir -p stagetest/results

                    cd stagetest
                    python3 -m robot \
                        -d results \
                        --variable APP_VERSION:"${APP_VERSION}" \
                        tests/Login.robot
                '''
            }
        }
    }

    post {
        always {
            robot(
                outputPath: 'stagetest/results',
                outputFileName: 'output.xml',
                reportFileName: 'report.html',
                logFileName: 'log.html'
            )

            archiveArtifacts(
                artifacts: 'stagetest/results/**/*,demoapp.log',
                allowEmptyArchive: true
            )
        }
    }
}

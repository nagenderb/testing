<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Secure Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 18px 8%;
        }

        .brand {
            font-size: 23px;
            font-weight: 700;
            color: #1d4ed8;
            letter-spacing: -0.5px;
        }

        /* Main content */
        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 36px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.07);
        }

        .login-card h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #0f172a;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Form fields */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            color: #0f172a;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.13);
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .forgot-password {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 24px;
            color: #2563eb;
            font-size: 13px;
            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px 16px;
            border-radius: 7px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-register {
            background: #2563eb;
            border: 1px solid #2563eb;
            color: #ffffff;
        }

        .btn-register:hover {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }

        .btn-login {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #334155;
        }

        .btn-login:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 26px 22px;
            }

            .login-card h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <div class="brand">SecurePortal</div>
    </header>

    <main class="main">
        <section class="login-card">
            <h1>Welcome back</h1>
            <p class="subtitle">
                Sign in to your account or create a new account to get started.
            </p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="username" required="">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required="">
                </div>

                <a href="#" class="forgot-password">Forgot password?</a>

                <div class="button-group">
                    <button type="button" id="registerBtn" class="btn btn-register">
                        Signup
                    </button>

                    <button type="submit" id="loginBtn" class="btn btn-login">
                        Login
                    </button>
                </div>
            </form>
        </section>
    </main>

    <footer class="footer">
        © 2026 SecurePortal. All rights reserved.
    </footer>

    <script>
        // Demo interactions for UI automation.
        // These buttons do not perform real account operations.

        document.getElementById("registerBtn").addEventListener("click", () => {
            alert("Register button clicked");
        });

        document.getElementById("loginForm").addEventListener("submit", (event) => {
            event.preventDefault();
            alert("Login button clicked");
        });
    </script>


</body></html>

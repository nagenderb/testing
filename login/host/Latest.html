<html lang="en">

    <style>
        * {

            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;

            flex-direction: column;

            padding: 18px 8%;
        }

        .brand {
            font-size: 23px;

        .form-group input:focus {

<body>
    <header class="header">
        <div class="brand">SecurePortal</div>
    </header>

    <main class="main">
        <section class="login-card">
            <h1>Welcome back</h1>
            <p class="subtitle">
                Sign in to your account or create a new account to get started.
            </p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email"
                           placeholder="you@example.com"
                           autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Enter your password"
                           autocomplete="current-password" required>
                </div>

                <a href="#" class="forgot-password">Forgot password?</a>

                <div class="button-group">
                    <button type="button" id="registerBtn"
                            class="btn btn-register">
                        SignUp
                    </button>

                    <button type="submit" id="loginBtn"
                            class="btn btn-login">
                        SignIn
                    </button>
                </div>
            </form>
        </section>
    </main>

    <footer class="footer">
        © 2026 SecurePortal. All rights reserved.
    </footer>

    <!-- Custom HTML modal: visible to Selenium screenshots -->
    <div id="modalOverlay" class="modal-overlay" hidden>
        <section class="modal"
                 role="dialog"
                 aria-modal="true"
                 aria-labelledby="modalTitle"
                 aria-describedby="modalMessage"
                 tabindex="-1">

            <h2 id="modalTitle">Notification</h2>
            <p id="modalMessage"></p>

            <div class="modal-actions">
                <button type="button" id="modalClose"
                        class="modal-close">
                    OK
                </button>
            </div>
        </section>
    </div>

    <script>
        const modalOverlay = document.getElementById("modalOverlay");
        const modal = modalOverlay.querySelector(".modal");
        const modalTitle = document.getElementById("modalTitle");
        const modalMessage = document.getElementById("modalMessage");
        const modalClose = document.getElementById("modalClose");

        let previousFocus = null;

        function showModal(title, message) {
            previousFocus = document.activeElement;

            modalTitle.textContent = title;
            modalMessage.textContent = message;

            modalOverlay.hidden = false;
            modal.focus();
        }

        function closeModal() {
            modalOverlay.hidden = true;

            if (previousFocus) {
                previousFocus.focus();
            }
        }

        document.getElementById("registerBtn")
            .addEventListener("click", () => {
                showModal(
                    "Registration",
                    "You will be redirected to Registration.\nPlease keep your details ready."
                );
            });

        document.getElementById("loginForm")
            .addEventListener("submit", (event) => {
                event.preventDefault();
                showModal("Login", "Login button clicked");
            });

        modalClose.addEventListener("click", closeModal);

        // Close when clicking the dark overlay outside the modal.
        modalOverlay.addEventListener("click", (event) => {
            if (event.target === modalOverlay) {
                closeModal();
            }
        });

        // Close with Escape.
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && !modalOverlay.hidden) {
                closeModal();
            }
        });
    </script>
</body>
</html>

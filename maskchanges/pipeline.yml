pipeline {
    agent {
        label 'Linux'
    }

    stages {

        stage('Checkout') {
            steps {
            
                 git branch: "${params.BRANCH_NAME?.trim()?params.BRANCH_NAME.trim() : 'main'}",
                    url: 'https://github.com/nagenderb/testing.git'
            }
        }

        stage('Run Robot Tests') {
            steps {
                sh '''
                    rm -rf results
                    mkdir -p results
                    cd maskchanges                    
                    python3 -m robot \
                        -d results \
                        --variable APP_VERSION:"${APP_VERSION}" \
                        tests/createNAConfig.robot
                '''
            }
        }
    }

    post {
        always {
            robot(
                outputPath: 'maskchanges/results',
                outputFileName: 'output.xml',
                reportFileName: 'report.html',
                logFileName: 'log.html'
            )

            archiveArtifacts(
                artifacts: 'results/**/*,demoapp.log',
                allowEmptyArchive: true
            )
        }
    }
}

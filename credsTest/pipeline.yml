pipeline {
    agent any

    stages {

        stage('Checkout') {
            steps {
                git branch: 'main',
                    url: 'https://github.com/nagenderb/testing.git'
            }
        }

        stage('Run Robot Tests') {
            steps {
                sh '''
                    rm -rf credsTest/results
                    mkdir -p credsTest/results
                    cd credsTest                    
                    python3 -m robot \
                        -d results \
                        --variable APP_VERSION:"${APP_VERSION}" \
                        tests/createNAConfig.robot
                '''
            }
        }
    }

    post {
        always {
            robot(
                outputPath: 'credsTest/results',
                outputFileName: 'output.xml',
                reportFileName: 'report.html',
                logFileName: 'log.html'
            )

            archiveArtifacts(
                artifacts: 'results/**/*,demoapp.log',
                allowEmptyArchive: true
            )
        }
    }
}

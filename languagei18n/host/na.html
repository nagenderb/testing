<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Network Configuration</title>
  <style>
    :root {
      --navy: #16324f;
      --blue: #2563eb;
      --blue-hover: #1d4ed8;
      --bg: #f3f6fb;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #64748b;
      --border: #d7dfeb;
      --success-bg: #ecfdf3;
      --success: #166534;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--navy);
      color: #fff;
      padding: 22px 28px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .12);
    }
    header .brand { font-size: 18px; font-weight: 700; letter-spacing: .2px; }
    header p { margin: 5px 0 0; color: #dbeafe; font-size: 13px; }
    main { width: min(760px, calc(100% - 32px)); margin: 36px auto; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, .05);
    }
    h1 { margin: 0 0 8px; font-size: 25px; }
    .intro { margin: 0 0 24px; color: var(--muted); line-height: 1.5; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: 13px; font-weight: 650; color: #334155; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      background: #fff;
      color: var(--text);
      font: inherit;
      outline: none;
    }
    input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, .13); }
    .actions { display: flex; justify-content: flex-end; margin-top: 24px; }
    button {
      border: 0;
      border-radius: 7px;
      padding: 11px 18px;
      background: var(--blue);
      color: #fff;
      font-weight: 650;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: var(--blue-hover); }
    #statusMessage {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 7px;
      background: var(--success-bg);
      color: var(--success);
      font-weight: 600;
      min-height: 42px;
    }
    #savedSummary { margin: 12px 0 0; color: var(--muted); font-size: 13px; }
    @media (max-width: 560px) {
      .card { padding: 20px; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">NetOps Console</div>
    <p>Network administration · Configuration workspace</p>
  </header>
  <main>
    <section class="card" aria-labelledby="pageTitle">
      <h1 id="pageTitle">Network Configuration</h1>
      <p class="intro">Enter the network interface settings and save the configuration.</p>
      <form id="networkForm">
        <div class="form-grid">
          <div class="field full">
            <label for="networkName">Network Name</label>
            <input id="networkName" name="networkName" type="text" required>
          </div>
          <div class="field">
            <label for="ipAddress">IP Address</label>
            <input id="ipAddress" name="ipAddress" type="text" inputmode="decimal" required>
          </div>
          <div class="field">
            <label for="subnetMask">Subnet Mask</label>
            <input id="subnetMask" name="subnetMask" type="text" required>
          </div>
          <div class="field">
            <label for="gateway">Default Gateway</label>
            <input id="gateway" name="gateway" type="text" required>
          </div>
          <div class="field">
            <label for="dnsServer">DNS Server</label>
            <input id="dnsServer" name="dnsServer" type="text" required>
          </div>
        </div>
        <div class="actions">
          <button id="saveConfiguration" type="submit">Save Configuration</button>
        </div>
      </form>
      <div id="statusMessage" role="status" aria-live="polite">No configuration saved yet.</div>
      <p id="savedSummary">Saved configuration details will appear here.</p>
    </section>
  </main>
  <script>
    const form = document.getElementById("networkForm");
    form.addEventListener("submit", function (event) {
      event.preventDefault();
      const name = document.getElementById("networkName").value.trim();
      const ip = document.getElementById("ipAddress").value.trim();
      const mask = document.getElementById("subnetMask").value.trim();
      const gateway = document.getElementById("gateway").value.trim();
      const dns = document.getElementById("dnsServer").value.trim();
      document.getElementById("statusMessage").textContent =
        `Configuration saved successfully for ${name}.`;
      document.getElementById("savedSummary").textContent =
        `IP: ${ip} | Subnet: ${mask} | Gateway: ${gateway} | DNS: ${dns}`;
    });
  </script>
</body>
</html>
